<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GOLD SMC PRO | Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 32px 25px;
      background: #111;
      border: 1px solid #c9a227;
      border-radius: 18px;
      box-shadow: 0 0 35px rgba(201, 162, 39, 0.12);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo h1 {
      color: #d8b44c;
      font-size: 27px;
      letter-spacing: 2px;
    }

    .logo p {
      color: #aaa;
      margin-top: 9px;
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 1px solid #383838;
      border-radius: 8px;
      background: #191919;
      color: #ddd;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      color: #080808;
      background: #d8b44c;
      border-color: #d8b44c;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      color: white;
      background: #090909;
      border: 1px solid #393939;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #d8b44c;
    }

    .submit {
      width: 100%;
      padding: 14px;
      color: #080808;
      background: #d8b44c;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .success {
      display: block !important;
      color: #b8f3c4;
      background: #102517;
      border: 1px solid #245b34;
    }

    .error {
      display: block !important;
      color: #ffb5b5;
      background: #2a1111;
      border: 1px solid #663333;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #777;
      font-size: 11px;
    }

    .demo-note {
      margin-top: 18px;
      color: #aaa;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="logo">
      <h1>GOLD SMC PRO</h1>
      <p>SMART MONEY CONCEPTS TRADING</p>
    </header>

    <div class="tabs">
      <button
        type="button"
        id="loginTab"
        class="tab active"
        onclick="setMode('login')">
        LOGIN
      </button>

      <button
        type="button"
        id="signupTab"
        class="tab"
        onclick="setMode('signup')">
        SIGN UP
      </button>
    </div>

    <form id="authForm">

      <label for="email">Email address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required>

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        minlength="6"
        required>

      <button
        type="submit"
        id="submitButton"
        class="submit">
        LOGIN
      </button>

    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <p class="demo-note">
      Secure account access. Trading dashboard currently uses
      demo functionality and does not place live trades.
    </p>

    <footer class="footer">
      GOLD SMC PRO &copy; 2026
    </footer>

  </main>

  <script>
    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
      "https://xgqhvebubohrthtxlxgj.supabase.co";

    // Replace the text below with your EXISTING
    // Supabase publishable key from your old index.html.
    // Keep the quotation marks.

    const SUPABASE_KEY = "sb_publishable_3i0SevSZ8PD0vipdMf8GQQ_In-MkLAI";

    // ==========================================
    // INITIALIZE
    // ==========================================

    const messageBox = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const passwordInput = document.getElementById("password");

    let mode = "login";
    let client = null;

    function showMessage(message, success = false) {
      messageBox.textContent = message;
      messageBox.className = success ? "success" : "error";
    }

    function setMode(newMode) {
      mode = newMode;

      document.getElementById("loginTab")
        .classList.toggle("active", mode === "login");

      document.getElementById("signupTab")
        .classList.toggle("active", mode === "signup");

      submitButton.textContent =
        mode === "login" ? "LOGIN" : "CREATE ACCOUNT";

      passwordInput.autocomplete =
        mode === "login" ? "current-password" : "new-password";

      messageBox.textContent = "";
      messageBox.className = "";
    }

    async function initialize() {
      if (!window.supabase) {
        showMessage(
          "Supabase failed to load. Check your internet connection and refresh."
        );
        submitButton.disabled = true;
        return;
      }

      if (
        !SUPABASE_URL.startsWith("https://") ||
        SUPABASE_KEY === "PASTE_YOUR_EXISTING_PUBLISHABLE_KEY_HERE"
      ) {
        showMessage(
          "Configuration incomplete. Add your existing Supabase publishable key."
        );
        submitButton.disabled = true;
        return;
      }

      client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      // If the user already has a valid session,
      // go directly to the dashboard.

      try {
        const { data, error } = await client.auth.getSession();

        if (error) {
          console.error("Session check failed:", error.message);
          return;
        }

        if (data.session) {
          window.location.replace("dashboard.html");
        }
      } catch (error) {
        console.error("Initialization error:", error);
      }
    }

    // ==========================================
    // LOGIN AND SIGNUP
    // ==========================================

    document.getElementById("authForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        if (!client) {
          showMessage(
            "Supabase is not ready. Check the configuration and refresh."
          );
          return;
        }

        const email =
          document.getElementById("email").value.trim();

        const password =
          passwordInput.value;

        submitButton.disabled = true;

        submitButton.textContent =
          mode === "login" ? "LOGGING IN..." : "CREATING ACCOUNT...";

        messageBox.textContent = "";
        messageBox.className = "";

        try {
          let result;

          if (mode === "login") {

            result = await client.auth.signInWithPassword({
              email: email,
              password: password
            });

          } else {

            result = await client.auth.signUp({
              email: email,
              password: password
            });

          }

          if (result.error) {
            showMessage(result.error.message);
            return;
          }

          if (mode === "signup") {

            if (result.data.session) {

              showMessage(
                "Account created successfully! Opening dashboard...",
                true
              );

              window.location.href = "dashboard.html";

            } else {

              showMessage(
                "Account created. Check your email for a confirmation link, then return and log in.",
                true
              );

            }

            return;
          }

          // Successful login: navigate to dashboard.

          if (result.data.session) {

            showMessage("Login successful! Opening dashboard...", true);

            window.location.href = "dashboard.html";

          } else {

            showMessage(
              "Login returned no active session. Please try again."
            );

          }

        } catch (error) {

          showMessage(
            error.message || "Unexpected error. Please try again."
          );

        } finally {

          submitButton.disabled = false;

          submitButton.textContent =
            mode === "login" ? "LOGIN" : "CREATE ACCOUNT";

        }
      });

    initialize();
  </script>

</body>
</html>
